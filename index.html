<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 20px; }
        
        /* Markdown specific overrides to look like Gemini */
        .prose pre { background-color: #1f2937 !important; border-radius: 0.5rem; padding: 1rem; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 0.75rem; margin-top: 0; }
        .prose *:last-child { margin-bottom: 0; }
        
        /* Mobile layout safeguard */
        body, html { height: 100%; width: 100%; overscroll-behavior-y: none; }
        .h-dvh { height: 100dvh; }
        
        /* Blinking cursor for streaming */
        .streaming-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s step-start infinite;
            margin-left: 2px;
            color: #3b82f6;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 overflow-hidden font-sans transition-colors duration-200">

    <!-- Fallback Loader -->
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white dark:bg-gray-900">
        <div class="flex flex-col items-center">
            <svg class="animate-spin h-10 w-10 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-lg font-medium">Loading App...</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="flex h-dvh w-full hidden opacity-0 transition-opacity duration-300">
        
        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-gray-50 dark:bg-gray-950 border-r border-gray-200 dark:border-gray-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <div class="p-4 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex-1 flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Chat
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                <!-- Chat history items injected here -->
            </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-800">
                <button onclick="openSettings()" class="w-full flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-gray-900 relative">
            
            <!-- Header -->
            <header class="flex-shrink-0 h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 sticky top-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md z-10">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="text-lg font-semibold truncate" id="current-chat-title">New Chat</h1>
                </div>
            </header>

            <!-- Chat Messages -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-6 pb-32">
                <!-- Messages injected here -->
            </div>

            <!-- Input Area -->
            <div class="flex-shrink-0 p-4 absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-transparent dark:from-gray-900 dark:via-gray-900 pt-10">
                <div class="max-w-4xl mx-auto relative">
                    <textarea id="chat-input" rows="1" class="w-full bg-gray-100 dark:bg-gray-800 border-none rounded-2xl pl-4 pr-12 py-3.5 focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-500 resize-none overflow-hidden block text-base shadow-sm" placeholder="Ask anything..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                    <button id="send-button" onclick="sendMessage()" class="absolute right-2 bottom-2 p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
                <div class="text-xs text-center text-gray-400 mt-2">AI can make mistakes. Check important info.</div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-850 rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-xl font-semibold">Settings</h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="api-key" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model</label>
                    <input type="text" id="model-name" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="deepseek/deepseek-r1:free" value="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt (Global)</label>
                    <textarea id="system-prompt" rows="3" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="You are a helpful AI assistant."></textarea>
                </div>
                <div class="flex items-center justify-between pt-2">
                    <span class="text-sm font-medium">Dark Mode</span>
                    <button id="theme-toggle" onclick="toggleTheme()" class="w-12 h-6 bg-gray-300 dark:bg-blue-600 rounded-full relative transition-colors duration-200 focus:outline-none">
                        <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 transform dark:translate-x-6"></span>
                    </button>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- Script Logic placed at the VERY END of body -->
    <script>
        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        const AppState = {
            settings: {
                apiKey: '',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: 'You are a helpful AI assistant.',
                theme: 'dark'
            },
            chats: [],
            currentChatId: null,
            isGenerating: false,
            abortController: null
        };

        const DOM = {
            app: document.getElementById('app'),
            loading: document.getElementById('loading'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            chatList: document.getElementById('chat-list'),
            chatTitle: document.getElementById('current-chat-title'),
            messagesContainer: document.getElementById('messages-container'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-button'),
            settingsModal: document.getElementById('settings-modal'),
            apiKeyInput: document.getElementById('api-key'),
            modelInput: document.getElementById('model-name'),
            systemInput: document.getElementById('system-prompt'),
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            try {
                // Load Settings
                const savedSettings = localStorage.getItem('ai_settings');
                if (savedSettings) AppState.settings = { ...AppState.settings, ...JSON.parse(savedSettings) };
                
                // Apply Theme
                applyTheme(AppState.settings.theme);

                // Load Chats
                const savedChats = localStorage.getItem('ai_chats');
                if (savedChats) {
                    AppState.chats = JSON.parse(savedChats);
                }

                if (AppState.chats.length === 0) {
                    createNewChat(false); // don't save to storage yet until message is sent
                } else {
                    const lastChatId = localStorage.getItem('ai_last_chat');
                    const exists = AppState.chats.find(c => c.id === lastChatId);
                    loadChat(exists ? lastChatId : AppState.chats[0].id);
                }

                renderSidebar();
                
                // Hide Loader & Show App
                setTimeout(() => {
                    DOM.loading.style.display = 'none';
                    DOM.app.classList.remove('hidden');
                    // Small delay to allow CSS transition to process
                    setTimeout(() => DOM.app.classList.remove('opacity-0'), 50);
                }, 300);

            } catch (e) {
                console.error("Initialization failed:", e);
                alert("Failed to initialize app. Please clear local storage.");
            }
        }

        // ==========================================
        // SETTINGS & THEME
        // ==========================================
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            AppState.settings.theme = AppState.settings.theme === 'dark' ? 'light' : 'dark';
            applyTheme(AppState.settings.theme);
        }

        function openSettings() {
            DOM.apiKeyInput.value = AppState.settings.apiKey;
            DOM.modelInput.value = AppState.settings.model;
            DOM.systemInput.value = AppState.settings.systemPrompt;
            DOM.settingsModal.classList.remove('hidden');
            if(window.innerWidth < 768) toggleSidebar();
        }

        function closeSettings() {
            DOM.settingsModal.classList.add('hidden');
        }

        function saveSettings() {
            const newKey = DOM.apiKeyInput.value.trim();
            if(!newKey) {
                alert("API Key is required.");
                return;
            }
            AppState.settings.apiKey = newKey;
            AppState.settings.model = DOM.modelInput.value.trim() || 'deepseek/deepseek-r1:free';
            AppState.settings.systemPrompt = DOM.systemInput.value.trim();
            
            localStorage.setItem('ai_settings', JSON.stringify(AppState.settings));
            closeSettings();
        }

        // ==========================================
        // CHAT MANAGEMENT
        // ==========================================
        function saveChatsToStorage() {
            localStorage.setItem('ai_chats', JSON.stringify(AppState.chats));
            if (AppState.currentChatId) {
                localStorage.setItem('ai_last_chat', AppState.currentChatId);
            }
        }

        function createNewChat(save = true) {
            if (AppState.isGenerating) return;
            
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Chat',
                messages: [],
                systemPrompt: AppState.settings.systemPrompt
            };
            
            AppState.chats.unshift(newChat);
            if(save) saveChatsToStorage();
            
            loadChat(newChat.id);
            renderSidebar();
            if(window.innerWidth < 768 && !DOM.sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
            DOM.chatInput.focus();
        }

        function loadChat(chatId) {
            if (AppState.isGenerating) return;
            
            AppState.currentChatId = chatId;
            const chat = AppState.chats.find(c => c.id === chatId);
            
            if (!chat) return;
            
            DOM.chatTitle.textContent = chat.title;
            renderMessages();
            renderSidebar(); // update active state
            saveChatsToStorage();
            
            if(window.innerWidth < 768 && !DOM.sidebar.classList.contains('-translate-x-full')) {
                toggleSidebar();
            }
        }

        function deleteChat(chatId, event) {
            event.stopPropagation();
            if (AppState.isGenerating) return;
            if (!confirm("Delete this chat?")) return;

            AppState.chats = AppState.chats.filter(c => c.id !== chatId);
            
            if (AppState.chats.length === 0) {
                createNewChat(true);
            } else if (AppState.currentChatId === chatId) {
                loadChat(AppState.chats[0].id);
            } else {
                renderSidebar();
                saveChatsToStorage();
            }
        }

        function renameChat(chatId, event) {
            event.stopPropagation();
            const chat = AppState.chats.find(c => c.id === chatId);
            if(!chat) return;
            
            const newTitle = prompt("Enter new chat name:", chat.title);
            if (newTitle && newTitle.trim() !== '') {
                chat.title = newTitle.trim();
                if(AppState.currentChatId === chatId) DOM.chatTitle.textContent = chat.title;
                saveChatsToStorage();
                renderSidebar();
            }
        }

        // ==========================================
        // UI RENDERING
        // ==========================================
        function toggleSidebar() {
            DOM.sidebar.classList.toggle('-translate-x-full');
            DOM.sidebarOverlay.classList.toggle('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function renderSidebar() {
            DOM.chatList.innerHTML = AppState.chats.map(chat => `
                <div class="group flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer transition-colors ${chat.id === AppState.currentChatId ? 'bg-gray-200 dark:bg-gray-800 text-blue-600 dark:text-blue-400' : 'hover:bg-gray-200 dark:hover:bg-gray-800'}" onclick="loadChat('${chat.id}')">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        <span class="text-sm font-medium truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <div class="hidden group-hover:flex items-center gap-1">
                        <button onclick="renameChat('${chat.id}', event)" class="p-1 text-gray-500 hover:text-blue-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 text-gray-500 hover:text-red-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                </div>
            `).join('');
        }

        function renderMessages() {
            const chat = AppState.chats.find(c => c.id === AppState.currentChatId);
            if (!chat || chat.messages.length === 0) {
                DOM.messagesContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 space-y-4">
                        <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center">
                            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <h3 class="text-xl font-medium text-gray-800 dark:text-gray-200">How can I help you today?</h3>
                    </div>
                `;
                return;
            }

            DOM.messagesContainer.innerHTML = '';
            chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            scrollToBottom();
        }

        function appendMessageUI(role, content, isStreaming = false) {
            // Remove empty state if present
            if (DOM.messagesContainer.querySelector('h3')) {
                DOM.messagesContainer.innerHTML = '';
            }

            const div = document.createElement('div');
            div.className = `flex gap-4 max-w-4xl mx-auto w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const innerDiv = document.createElement('div');
            
            if (role === 'user') {
                innerDiv.className = 'bg-gray-100 dark:bg-gray-800 px-5 py-3.5 rounded-3xl rounded-br-sm max-w-[85%] text-base whitespace-pre-wrap';
                innerDiv.textContent = content; // Safe against XSS
            } else {
                div.id = 'latest-ai-message'; // tag for streaming updates
                innerDiv.className = `prose prose-slate dark:prose-invert max-w-[90%] w-full leading-relaxed ${isStreaming ? 'streaming-cursor' : ''}`;
                
                try {
                    innerDiv.innerHTML = marked.parse(content);
                } catch(e) {
                    innerDiv.textContent = content; // Fallback
                }
            }

            div.appendChild(innerDiv);
            DOM.messagesContainer.appendChild(div);
            scrollToBottom();
        }

        function updateStreamingMessage(content) {
            const latestMsg = document.getElementById('latest-ai-message');
            if (latestMsg) {
                const inner = latestMsg.querySelector('div');
                try {
                    inner.innerHTML = marked.parse(content);
                } catch(e) {
                    inner.textContent = content;
                }
                scrollToBottom();
            }
        }

        function removeStreamingCursor() {
            const latestMsg = document.getElementById('latest-ai-message');
            if (latestMsg) {
                latestMsg.querySelector('div').classList.remove('streaming-cursor');
                latestMsg.removeAttribute('id'); // remove tag
            }
        }

        function scrollToBottom() {
            DOM.messagesContainer.scrollTop = DOM.messagesContainer.scrollHeight;
        }

        // ==========================================
        // API & CHAT LOGIC
        // ==========================================
        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            if (AppState.isGenerating) return;
            
            const content = DOM.chatInput.value.trim();
            if (!content) return;

            if (!AppState.settings.apiKey) {
                openSettings();
                return;
            }

            const chat = AppState.chats.find(c => c.id === AppState.currentChatId);
            if (!chat) return;

            // Generate title if first message
            if (chat.messages.length === 0) {
                chat.title = content.slice(0, 30) + (content.length > 30 ? '...' : '');
                DOM.chatTitle.textContent = chat.title;
                renderSidebar();
            }

            // Update UI User
            DOM.chatInput.value = '';
            DOM.chatInput.style.height = 'auto'; // reset resize
            chat.messages.push({ role: 'user', content: content });
            appendMessageUI('user', content);
            saveChatsToStorage();

            // Prepare API
            setGeneratingState(true);
            
            // Build API Messages
            const apiMessages = [];
            if (chat.systemPrompt) {
                apiMessages.push({ role: "system", content: chat.systemPrompt });
            }
            apiMessages.push(...chat.messages);

            // Setup AI message in state and UI
            chat.messages.push({ role: 'assistant', content: '' });
            appendMessageUI('assistant', '', true);

            try {
                AppState.abortController = new AbortController();
                
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${AppState.settings.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: AppState.settings.model,
                        messages: apiMessages,
                        stream: true
                    }),
                    signal: AppState.abortController.signal
                });

                if (!response.ok) {
                    const err = await response.json().catch(()=>({}));
                    throw new Error(err.error?.message || `API Error: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed === 'data: [DONE]') continue;
                        if (trimmed.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(trimmed.slice(6));
                                const delta = data.choices[0]?.delta?.content || "";
                                if (delta) {
                                    chat.messages[chat.messages.length - 1].content += delta;
                                    updateStreamingMessage(chat.messages[chat.messages.length - 1].content);
                                }
                            } catch (e) {
                                console.warn("Chunk parse error:", e, "Line:", trimmed);
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Fetch aborted');
                } else {
                    console.error('Generation error:', error);
                    chat.messages[chat.messages.length - 1].content += `\n\n**Error:** ${error.message}`;
                    updateStreamingMessage(chat.messages[chat.messages.length - 1].content);
                }
            } finally {
                removeStreamingCursor();
                setGeneratingState(false);
                saveChatsToStorage();
            }
        }

        function setGeneratingState(isGen) {
            AppState.isGenerating = isGen;
            DOM.sendBtn.disabled = isGen;
            DOM.chatInput.disabled = isGen;
            if (isGen) {
                DOM.sendBtn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else {
                DOM.sendBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>`;
                setTimeout(() => DOM.chatInput.focus(), 100);
            }
        }

        // Utils
        function escapeHtml(unsafe) {
            return (unsafe || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Start App
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
